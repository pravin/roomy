# Builds and tests every chapter on Linux, macOS and Windows.
name: CI

on:
  push:
    branches: [master]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  # Every chapter shares one target folder, so the dependencies they have in
  # common only get built once.
  CARGO_TARGET_DIR: ${{ github.workspace }}/target

jobs:
  chapters:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Linux libraries for Tauri
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Test every chapter
        shell: bash
        run: |
          for chapter in chapters/*/; do
            echo "::group::$chapter"
            (
              cd "$chapter"
              if [ -f app/package.json ]; then
                (cd app && npm ci && npm run build)
              fi
              cargo clippy --workspace --all-targets -- -D warnings
              cargo test --workspace
            ) || exit 1
            echo "::endgroup::"
          done
