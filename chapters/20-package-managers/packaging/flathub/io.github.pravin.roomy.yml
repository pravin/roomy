# Flatpak manifest. Flathub builds without network access, so the .deb from
# the GitHub release is the simplest thing to wrap. See chapter 20.
id: io.github.pravin.roomy
runtime: org.gnome.Platform
runtime-version: "48"
sdk: org.gnome.Sdk
command: roomy-app
finish-args:
  - --socket=wayland
  - --socket=fallback-x11
  - --share=ipc
  - --device=dri
  # Roomy's whole job is looking at your files.
  - --filesystem=host
  - --talk-name=org.freedesktop.FileManager1
modules:
  - name: roomy
    buildsystem: simple
    sources:
      - type: file
        dest-filename: roomy.deb
        url: https://github.com/pravin/roomy/releases/download/v1.0.0/Roomy_1.0.0_amd64.deb
        sha256: REPLACE_WITH_SHA256
      - type: file
        path: io.github.pravin.roomy.metainfo.xml
    build-commands:
      - ar -x roomy.deb
      - tar -xf data.tar.gz
      - install -Dm755 usr/bin/roomy-app -t /app/bin/
      - install -Dm644 usr/share/applications/Roomy.desktop /app/share/applications/io.github.pravin.roomy.desktop
      - desktop-file-edit --set-icon=io.github.pravin.roomy /app/share/applications/io.github.pravin.roomy.desktop
      - install -Dm644 usr/share/icons/hicolor/128x128/apps/roomy-app.png /app/share/icons/hicolor/128x128/apps/io.github.pravin.roomy.png
      - install -Dm644 io.github.pravin.roomy.metainfo.xml -t /app/share/metainfo/
